name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
      - name: Install native deps
        run: |
          # The hosted runner image ships third-party apt sources (Chrome, Azure CLI)
          # that intermittently serve a Packages.gz whose hash does not match their
          # Release file, which makes `apt-get update` exit non-zero and fails the job
          # before any of our code is touched. We only need packages from the Ubuntu
          # archive, so drop those sources first.
          sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
          sudo apt-get update
          sudo apt-get install -y mingw-w64 \
            libx11-dev libxcb1-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libvulkan-dev libasound2-dev
      - name: fmt
        run: cargo fmt --all -- --check
      - name: clippy
        run: cargo clippy --workspace --all-targets
      - name: build
        run: cargo build --workspace
      - name: test
        run: cargo test --workspace
      - name: cross-compile test fixtures (windows-gnu)
        run: cargo build --target x86_64-pc-windows-gnu -p nigg-tests-fixtures
