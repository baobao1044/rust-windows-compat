[package]
name = "nigg-input"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
default = ["evdev"]
# evdev keyboard/mouse backend (default on). Uses the `evdev` crate with its
# default features disabled so it does NOT pull `libudev-sys` (which needs
# `libudev-dev`, not present on this host). Device enumeration is done by
# scanning `/dev/input/event*` directly.
evdev = ["dep:evdev"]
# gilrs gamepad backend (default OFF). `gilrs` 0.10 unconditionally depends on
# `libudev-sys` on Linux, so enabling this feature requires `libudev-dev` to be
# installed. With the feature off the gamepad code paths compile to no-ops.
gamepad = ["dep:gilrs"]

[dependencies]
# evdev's only opt-in features are `serde` and `tokio` (neither is default), so the
# crate pulls no system headers by default and builds cleanly on this host. We keep
# the default feature set.
evdev = { workspace = true, optional = true }
gilrs = { workspace = true, optional = true }
log.workspace = true
thiserror.workspace = true
